- JellyGlance:
    icon: https://jellyglance.com/project-logo.png
    href: http://jellyglance:3000
    description: Sessions, downloads, alerts, storage
    widget:
      type: customapi
      url: http://jellyglance:3000/api/widgets/homepage
      refreshInterval: 60000
      display: list
      headers:
        x-api-token: YOUR_JELLYGLANCE_API_KEY
      mappings:
        - field: storage
          label: Storage
          format: text
          additionalField:
            field: sessionsRecent
            format: number
            color: theme
        - field: downloads
          label: Downloads
          format: number
          additionalField:
            field: stalled
            format: number
            color: adaptive
        - field: digestOk
          label: Digest
          format: text
          remap:
            - value: true
              to: Clear
            - any: true
              to: Check Glance
          additionalField:
            field: digest
            format: number
            color: adaptive
        - field: invites
          label: Invites
          format: number
          additionalField:
            field: calendarUpcoming
            format: number
            color: theme
        - field: users
          label: Users
          format: number
          additionalField:
            field: viewersToday
            format: number
            color: theme
        - field: movies
          label: Movies
          format: number
          additionalField:
            field: addedWeek
            format: number
            color: theme

