name: PR Labeler

# pull_request (not pull_request_target): runs from the PR branch so this
# workflow can label the PR that introduces it. Same-repo PRs only need
# GITHUB_TOKEN with pull-requests: write. Fork PRs get labels after merge
# when this file is on the default branch (or add pull_request_target later).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ensure-labels:
    name: Ensure labels exist
    runs-on: ubuntu-latest
    steps:
      - name: Create path + size labels if missing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = [
              { name: 'ci', color: 'ededed', description: 'CI / GitHub Actions / workflows' },
              { name: 'docs', color: '0075ca', description: 'Documentation' },
              { name: 'web', color: '5319e7', description: 'apps/web changes' },
              { name: 'api', color: '1d76db', description: 'apps/api changes' },
              { name: 'docker', color: '0e8a16', description: 'Docker / compose / entrypoint' },
              { name: 'security', color: 'b60205', description: 'Security-related paths' },
              { name: 'dependencies', color: 'cec639', description: 'Dependency / lockfile changes' },
              { name: 'size/XS', color: 'c2e0c6', description: 'PR diff size XS' },
              { name: 'size/S', color: '0e8a16', description: 'PR diff size S' },
              { name: 'size/M', color: 'fbca04', description: 'PR diff size M' },
              { name: 'size/L', color: 'd93f0b', description: 'PR diff size L' },
              { name: 'size/XL', color: 'b60205', description: 'PR diff size XL' },
            ];
            const { owner, repo } = context.repo;
            for (const label of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`Created label ${label.name}`);
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }

  paths:
    name: Path labels
    needs: [ensure-labels]
    runs-on: ubuntu-latest
    steps:
      - name: Label by paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

  size:
    name: Size label
    needs: [ensure-labels]
    runs-on: ubuntu-latest
    steps:
      - name: Apply size label
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const additions = pr.additions || 0;
            const deletions = pr.deletions || 0;
            const total = additions + deletions;

            let size = 'size/XS';
            if (total > 1000) size = 'size/XL';
            else if (total > 500) size = 'size/L';
            else if (total > 200) size = 'size/M';
            else if (total > 50) size = 'size/S';

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;
            const sizes = ['size/XS', 'size/S', 'size/M', 'size/L', 'size/XL'];

            const current = (pr.labels || []).map((l) => l.name).filter((n) => sizes.includes(n));
            for (const name of current) {
              if (name !== size) {
                try {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            if (!current.includes(size)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [size] });
            }

            core.info(`PR #${issue_number}: ${total} lines → ${size}`);

  assign:
    name: Assign maintainer
    runs-on: ubuntu-latest
    steps:
      - name: Assign Nerdy-Technician
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const ASSIGNEE = 'Nerdy-Technician';
            const pr = context.payload.pull_request;
            if (!pr) return;
            const assignees = (pr.assignees || []).map((a) => a.login);
            if (assignees.includes(ASSIGNEE)) {
              core.info(`Already assigned to ${ASSIGNEE}`);
              return;
            }
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [ASSIGNEE],
            });
            core.info(`Assigned ${ASSIGNEE} to PR #${pr.number}`);
