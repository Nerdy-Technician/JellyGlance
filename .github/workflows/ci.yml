name: CI

on:
  pull_request:
    paths:
      - ".github/RELEASE"
      - ".github/RELEASE.beta"
      - ".github/RELEASE.BETA"
      - ".github/release.md"
      - ".github/release-beta.md"
  push:
    branches:
      - main
    paths:
      - ".github/RELEASE"
      - ".github/RELEASE.beta"
      - ".github/RELEASE.BETA"
      - ".github/release.md"
      - ".github/release-beta.md"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run lint
      - run: npm run build
      - run: npm run build:docs
