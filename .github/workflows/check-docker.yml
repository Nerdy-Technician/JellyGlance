name: JellyGlance Build Bot

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "scripts/entrypoint.sh"
      - ".github/workflows/check-docker.yml"
      - ".github/actions/mint-bot-token/**"
  push:
    branches:
      - main
      - BETA
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yml"
      - "package.json"
      - "package-lock.json"
      - "apps/**"
      - "scripts/entrypoint.sh"
      - ".github/workflows/check-docker.yml"
      - ".github/actions/mint-bot-token/**"
  schedule:
    # Mondays 07:00 UTC — full multi-arch including arm/v7
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: check-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # PRs/pushes: amd64 + arm64 in parallel (fast enough for CI).
  # Weekly/manual: also build arm/v7 (slow under QEMU — keep off the PR critical path).
  prepare:
    name: "JellyGlance Build Bot · Platforms"
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - name: Select platforms
        id: platforms
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'platforms=["linux/amd64","linux/arm64","linux/arm/v7"]' >> "$GITHUB_OUTPUT"
            echo "Full multi-arch set (includes arm/v7)"
          else
            echo 'platforms=["linux/amd64","linux/arm64"]' >> "$GITHUB_OUTPUT"
            echo "PR/push set (amd64 + arm64). arm/v7 runs on schedule/manual and Publish."
          fi

  build:
    name: "JellyGlance Build Bot · ${{ matrix.platform }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (${{ matrix.platform }} — no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          tags: jellyglance:ci
          cache-from: type=gha,scope=docker-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.platform }}

      - name: Docker summary
        if: always()
        run: |
          {
            echo "## JellyGlance Build Bot · \`${{ matrix.platform }}\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: "JellyGlance Build Bot · Report"
    needs:
      - prepare
      - build
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mint JellyGlance Build Bot token
        id: bot
        uses: ./.github/actions/mint-bot-token
        with:
          bot-name: JellyGlance Build Bot
          app-id: ${{ secrets.BUILD_BOT_APP_ID }}
          private-key: ${{ secrets.BUILD_BOT_PRIVATE_KEY }}

      - name: Build PR validation report
        id: summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ steps.bot.outputs.token }}
          script: |
            const build = '${{ needs.build.result }}';
            const platforms = '${{ needs.prepare.outputs.platforms }}';
            const icon = (result) => result === 'success' ? '✅' : result === 'failure' ? '❌' : result === 'cancelled' ? '⏹️' : '❓';
            const overall = build === 'success' ? 'PASSED' : build === 'cancelled' ? 'CANCELLED' : 'FAILED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const usingBot = '${{ steps.bot.outputs.using-bot }}' === 'true';

            const body = [
              '<!-- jellyglance-check-docker-report -->',
              `## ${icon(build)} JellyGlance Docker check · \`${overall}\``,
              '',
              `| Check | Result |`,
              `| --- | --- |`,
              `| Docker build (parallel, no push) | ${icon(build)} \`${build}\` |`,
              '',
              `- Platforms: \`${platforms}\``,
              `- Commit: \`${sha.slice(0, 7)}\``,
              `- Run: [View details](${runUrl})`,
              '',
              '_PR/push builds \`amd64\` + \`arm64\` in parallel. \`arm/v7\` runs on weekly schedule, manual dispatch, and Publish._',
              '',
              usingBot
                ? '_Posted by **JellyGlance Build Bot**._'
                : '_Posted by github-actions[bot] (configure BUILD_BOT_APP_ID / BUILD_BOT_PRIVATE_KEY to use JellyGlance Build Bot)._',
            ].join('\n');

            core.setOutput('overall', overall);

            // New comment on every PR commit — do not edit/delete previous notes.
            const prNumber = context.payload.pull_request?.number;
            if (prNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      # Do not fail Report when Build fails — Build already gates the run.
