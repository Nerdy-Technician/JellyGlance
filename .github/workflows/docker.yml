name: JellyGlance Publish Bot

on:
  push:
    branches:
      - main
      - BETA
    paths:
      - ".github/RELEASE"
      - ".github/RELEASE.beta"
      - ".github/RELEASE.BETA"
      - ".github/release.md"
      - ".github/release-beta.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: "JellyGlance Publish Bot · GHCR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Mint JellyGlance Publish Bot token
        id: bot
        uses: ./.github/actions/mint-bot-token
        with:
          bot-name: JellyGlance Publish Bot
          app-id: ${{ secrets.PUBLISH_BOT_APP_ID }}
          private-key: ${{ secrets.PUBLISH_BOT_PRIVATE_KEY }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ steps.bot.outputs.app-slug || github.actor }}
          password: ${{ steps.bot.outputs.token }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nerdy-technician/jellyglance
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/BETA' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
