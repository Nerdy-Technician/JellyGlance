name: JellyGlance Publish Bot

on:
  # Manual rebuild of the rolling main/latest (or beta) image from the selected
  # branch. Versioned release images are built by the Release Bot when a
  # release is published.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Primary image repo this workflow publishes to (also baked in as JG_IMAGE_REPO).
  IMAGE_NAME: ghcr.io/jellyglance/server
  # Old user package, only pushed when the legacy push is switched on (see below).
  LEGACY_IMAGE_NAME: ghcr.io/nerdy-technician/jellyglance

jobs:
  image:
    name: "JellyGlance Publish Bot · GHCR"
    runs-on: ubuntu-latest
    env:
      # Job-level boolean so steps can check it without exposing the secret.
      LEGACY_PUSH_ENABLED: ${{ vars.LEGACY_IMAGE_PUSH == 'true' && secrets.LEGACY_GHCR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # GITHUB_TOKEN (packages: write) can push to the org package
          # ghcr.io/jellyglance/server from JellyGlance/Server.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/BETA' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Primary repo this build pushes to; Settings uses it to show the
          # image-move notice. A dual publish must pass the primary repo only,
          # never label the old repo as the new one.
          build-args: |
            JG_IMAGE_REPO=${{ env.IMAGE_NAME }}

      # Optional legacy push to the old user package during the move. Off unless the
      # repo var LEGACY_IMAGE_PUSH is 'true' AND the LEGACY_GHCR_TOKEN secret (classic
      # PAT with write:packages for Nerdy-Technician) is set. It's a separate build with
      # JG_IMAGE_REPO set to the legacy repo, so old-image users still see the move
      # notice. Buildx reuses the cache from the primary build, so only the runtime
      # layers after the ARG rebuild. Trivy scans the primary image only.
      - name: Legacy image push skipped
        if: env.LEGACY_PUSH_ENABLED != 'true'
        run: echo "::notice::Legacy push to ${{ env.LEGACY_IMAGE_NAME }} skipped (needs repo var LEGACY_IMAGE_PUSH=true and secret LEGACY_GHCR_TOKEN)."

      - name: Login to GHCR (legacy, Nerdy-Technician)
        if: env.LEGACY_PUSH_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: Nerdy-Technician
          password: ${{ secrets.LEGACY_GHCR_TOKEN }}

      - name: Docker metadata (legacy)
        if: env.LEGACY_PUSH_ENABLED == 'true'
        id: meta-legacy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.LEGACY_IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/BETA' }}
      - name: Build and push legacy image
        if: env.LEGACY_PUSH_ENABLED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta-legacy.outputs.tags }}
          labels: ${{ steps.meta-legacy.outputs.labels }}
          # The legacy repo, so the Settings banner still tells these users to move.
          build-args: |
            JG_IMAGE_REPO=${{ env.LEGACY_IMAGE_NAME }}

  trivy-image:
    name: "JellyGlance Publish Bot · Trivy image"
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/BETA" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
