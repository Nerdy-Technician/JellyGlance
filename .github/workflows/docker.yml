name: JellyGlance Publish Bot

on:
  push:
    branches:
      - main
      - BETA
    paths:
      - ".github/RELEASE"
      - ".github/RELEASE.beta"
      - ".github/RELEASE.BETA"
      - ".github/release.md"
      - ".github/release-beta.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: "JellyGlance Publish Bot · GHCR"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Repo-scoped App tokens often cannot write user GHCR packages even with
          # Packages: write. GITHUB_TOKEN works because this package already grants
          # Actions access to Nerdy-Technician/JellyGlance.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/nerdy-technician/jellyglance
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/BETA' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  trivy-image:
    name: "JellyGlance Publish Bot · Trivy image"
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/BETA" ]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "ghcr.io/nerdy-technician/jellyglance:${{ steps.tag.outputs.tag }}"

      - name: Trivy image scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "ghcr.io/nerdy-technician/jellyglance:${{ steps.tag.outputs.tag }}"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
