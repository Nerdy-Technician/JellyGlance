name: Notify / Discord Issues

on:
  issues:
    types:
      - opened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Post new issue to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Post issue notification
        env:
          DISCORD_EVENT_TYPE: issue
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_ISSUE_WEBHOOK }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
          ISSUE_AUTHOR_AVATAR: ${{ github.event.issue.user.avatar_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_ISSUE_WEBHOOK is not set. Skipping issue notification."
            exit 0
          fi
          node .github/scripts/discord-notify.mjs
