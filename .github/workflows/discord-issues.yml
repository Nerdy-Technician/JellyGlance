name: Notify / Discord Issues

on:
  issues:
    types:
      - opened
      - reopened
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Post issue update to Discord
    # The Dependency Dashboard is rewritten by Renovate all the time; keep it out of Discord.
    if: ${{ github.event_name == 'issues' && github.event.issue.title != 'Dependency Dashboard' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Post issue notification
        env:
          DISCORD_EVENT_TYPE: issue
          # Security alert issues go to the security channel when it is configured.
          DISCORD_WEBHOOK_URL: ${{ contains(github.event.issue.labels.*.name, 'security-alert') && (secrets.DISCORD_SECURITY_WEBHOOK || secrets.DISCORD_ISSUE_WEBHOOK) || secrets.DISCORD_ISSUE_WEBHOOK }}
          ISSUE_ACTION: ${{ github.event.action }}
          ISSUE_STATE_REASON: ${{ github.event.issue.state_reason }}
          ISSUE_ACTOR: ${{ github.actor }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
          ISSUE_AUTHOR_AVATAR: ${{ github.event.issue.user.avatar_url }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_ISSUE_WEBHOOK is not set. Skipping issue notification."
            exit 0
          fi
          node .github/scripts/discord-notify.mjs || echo "::warning::Discord issue notification failed."
