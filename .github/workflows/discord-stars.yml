name: Notify / Discord Stars

on:
  workflow_dispatch:
    inputs:
      previous_override:
        description: "Optional previous star count (e.g. 108) to re-digest after fixing auth. Leave blank normally."
        required: false
        type: string
  schedule:
    - cron: "0 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: discord-star-notifications
  cancel-in-progress: false

jobs:
  stars:
    name: Post hourly star digest
    runs-on: ubuntu-latest
    env:
      DISCORD_STARS_WEBHOOK: ${{ secrets.DISCORD_STARS_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore star state
        id: star-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .discord-star-state
          key: discord-stars-${{ github.run_id }}
          restore-keys: |
            discord-stars-

      - name: Read star state
        id: stars
        env:
          # Actions GITHUB_TOKEN cannot list stargazers (403 since 2026-06).
          # Needs a collaborator/admin user PAT as STARS_GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.STARS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          STAR_PREVIOUS_OVERRIDE: ${{ inputs.previous_override }}
        run: |
          if [ -z "${{ secrets.STARS_GITHUB_TOKEN }}" ]; then
            echo "::warning::STARS_GITHUB_TOKEN is not set. GITHUB_TOKEN cannot list stargazers (403). Add a collaborator/admin PAT named STARS_GITHUB_TOKEN."
          fi
          node .github/scripts/read-star-state.mjs

      - name: Install roster image deps
        if: ${{ env.DISCORD_STARS_WEBHOOK != '' && steps.stars.outputs.changed == 'true' && steps.stars.outputs.user_count != '0' }}
        run: python3 -m pip install --user pillow

      - name: Post Discord star update
        if: ${{ env.DISCORD_STARS_WEBHOOK != '' && steps.stars.outputs.changed == 'true' && steps.stars.outputs.user_count != '0' }}
        env:
          DISCORD_EVENT_TYPE: stars
          DISCORD_WEBHOOK_URL: ${{ env.DISCORD_STARS_WEBHOOK }}
          STAR_COUNT: ${{ steps.stars.outputs.current }}
          PREVIOUS_STAR_COUNT: ${{ steps.stars.outputs.previous }}
          STAR_USERS_FILE: ${{ steps.stars.outputs.users_file }}
          STAR_USERS: ${{ steps.stars.outputs.users }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: node .github/scripts/discord-notify.mjs

      - name: Fail when profiles unresolved
        if: ${{ steps.stars.outputs.changed == 'true' && steps.stars.outputs.user_count == '0' }}
        run: |
          echo "::error::Star count rose but no stargazer profiles resolved (usually missing STARS_GITHUB_TOKEN). Not posting and not advancing saved count."
          exit 1

      - name: Write star state
        if: ${{ steps.stars.outputs.current != '' && ((steps.stars.outputs.changed == 'true' && steps.stars.outputs.user_count != '0') || (steps.stars.outputs.changed != 'true' && steps.stars.outputs.has_state != 'true')) }}
        env:
          STAR_COUNT: ${{ steps.stars.outputs.current }}
        run: |
          mkdir -p .discord-star-state
          printf "%s\n" "${STAR_COUNT}" > .discord-star-state/count.txt

      - name: Save star state
        if: ${{ steps.stars.outputs.current != '' && ((steps.stars.outputs.changed == 'true' && steps.stars.outputs.user_count != '0') || (steps.stars.outputs.changed != 'true' && steps.stars.outputs.has_state != 'true')) }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .discord-star-state
          key: discord-stars-${{ steps.stars.outputs.current }}
