name: Discord Star Notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: discord-star-notifications
  cancel-in-progress: false

jobs:
  stars:
    name: Post new star updates
    runs-on: ubuntu-latest
    env:
      DISCORD_STARS_WEBHOOK: ${{ secrets.DISCORD_STARS_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore star state
        id: star-cache
        uses: actions/cache/restore@v6
        with:
          path: .discord-star-state
          key: discord-stars-${{ github.run_id }}
          restore-keys: |
            discord-stars-

      - name: Read star state
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const repo = process.env.REPO;
          const repoData = JSON.parse(execFileSync("gh", ["api", `repos/${repo}`], { encoding: "utf8" }));
          const current = Number(repoData.stargazers_count || 0);
          const stateFile = ".discord-star-state/count.txt";
          const hasState = fs.existsSync(stateFile);

          let previous = current;
          if (hasState) {
            previous = Number(fs.readFileSync(stateFile, "utf8").trim() || current);
          }

          const gained = Math.max(0, current - previous);
          let users = "";
          if (gained > 0) {
            try {
              const lastPage = Math.max(1, Math.ceil(current / 100));
              const pages = [...new Set([1, lastPage])];
              const stargazers = pages.flatMap((page) => JSON.parse(execFileSync("gh", [
                  "api",
                  `repos/${repo}/stargazers?per_page=100&page=${page}`,
                  "-H",
                  "Accept: application/vnd.github.star+json",
                ], { encoding: "utf8" })));

              users = stargazers
                .filter((entry) => entry?.user?.login)
                .filter((entry, index, entries) => entries.findIndex((candidate) => candidate.user.login === entry.user.login) === index)
                .sort((a, b) => new Date(b.starred_at || 0) - new Date(a.starred_at || 0))
                .slice(0, gained)
                .map((entry) => `[@${entry.user.login}](${entry.user.html_url})`)
                .join(", ");
            } catch (error) {
              console.log(`Unable to read stargazer users: ${error.message}`);
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous=${previous}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${current > previous ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_state=${hasState ? "true" : "false"}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `users=${users}\n`);
          NODE

      - name: Post Discord star update
        if: ${{ env.DISCORD_STARS_WEBHOOK != '' && steps.stars.outputs.changed == 'true' }}
        env:
          DISCORD_EVENT_TYPE: stars
          DISCORD_WEBHOOK_URL: ${{ env.DISCORD_STARS_WEBHOOK }}
          STAR_COUNT: ${{ steps.stars.outputs.current }}
          PREVIOUS_STAR_COUNT: ${{ steps.stars.outputs.previous }}
          STAR_USERS: ${{ steps.stars.outputs.users }}
          REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: node .github/scripts/discord-notify.mjs

      - name: Write star state
        if: ${{ steps.stars.outputs.current != '' && (steps.stars.outputs.changed == 'true' || steps.stars.outputs.has_state != 'true') }}
        env:
          STAR_COUNT: ${{ steps.stars.outputs.current }}
        run: |
          mkdir -p .discord-star-state
          printf "%s\n" "${STAR_COUNT}" > .discord-star-state/count.txt

      - name: Save star state
        if: ${{ steps.stars.outputs.current != '' && (steps.stars.outputs.changed == 'true' || steps.stars.outputs.has_state != 'true') }}
        uses: actions/cache/save@v6
        with:
          path: .discord-star-state
          key: discord-stars-${{ steps.stars.outputs.current }}
