name: Notify / Discord CI

on:
  workflow_run:
    workflows:
      - JellyGlance Check Bot
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  notify:
    name: Post CI result to Discord
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Post CI notification
        env:
          DISCORD_EVENT_TYPE: workflow
          WORKFLOW_KIND: ci
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_CI_WEBHOOK }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          DISPLAY_TITLE: ${{ github.event.workflow_run.display_title }}
          ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
          PR_URL: ${{ github.event.workflow_run.pull_requests[0].number && format('{0}/{1}/pull/{2}', github.server_url, github.repository, github.event.workflow_run.pull_requests[0].number) || '' }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_CI_WEBHOOK is not set. Skipping CI notification."
            exit 0
          fi
          node .github/scripts/discord-notify.mjs || echo "::warning::Discord CI notification failed."
