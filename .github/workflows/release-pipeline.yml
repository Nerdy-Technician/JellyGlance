name: JellyGlance Release Bot

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - BETA
    paths:
      - ".github/RELEASE"
      - ".github/release.md"
      - ".github/RELEASE.beta"
      - ".github/RELEASE.BETA"
      - ".github/release-beta.md"

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: file-release
  cancel-in-progress: false

jobs:
  release:
    name: "JellyGlance Release Bot · Pipeline"
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Mint JellyGlance Release Bot token
        id: bot
        uses: ./.github/actions/mint-bot-token
        with:
          bot-name: JellyGlance Release Bot
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Read release file
        id: release
        run: |
          node <<'NODE'
          const fs = require("fs");

          const isBeta = process.env.GITHUB_REF_NAME === "BETA";
          const releaseCandidates = isBeta
            ? [
                ".github/release-beta.md",
                ".github/RELEASE.beta",
                ".github/RELEASE.BETA",
                ".github/RELEASE",
              ]
            : [
                ".github/release.md",
                ".github/RELEASE",
              ];

          const releaseFile = releaseCandidates.find((candidate) => fs.existsSync(candidate));
          if (!releaseFile) {
            throw new Error("Could not find a release metadata file. Expected .github/release.md or .github/RELEASE for stable, and .github/release-beta.md or .github/RELEASE.beta for beta.");
          }

          if (!releaseFile.startsWith(".github/release")) {
            const preferred = isBeta
              ? ".github/release-beta.md"
              : ".github/release.md";
            console.log(`::notice::Using legacy release metadata file ${releaseFile}; migrate to ${preferred} for naming consistency.`);
          }

          const raw = fs.readFileSync(releaseFile, "utf8").replace(/\r\n/g, "\n");
          const semver = /^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/;
          const parts = raw.split(/^---\s*$/m);
          const maybeHeader = parts[0] || "";
          const hasFrontmatter =
            parts.length > 1 &&
            maybeHeader.split("\n").some((line) => /^(version|title)\s*:/i.test(line));
          const header = hasFrontmatter ? maybeHeader : "";
          const notes = (hasFrontmatter ? parts.slice(1).join("---") : raw).trim();
          const meta = {};

          for (const line of header.split("\n")) {
            const match = line.match(/^([A-Za-z_][A-Za-z0-9_-]*)\s*:\s*(.+)$/);
            if (match) {
              meta[match[1].toLowerCase()] = match[2].trim();
            }
          }

          const heading = raw.match(/^#{1,6}\s*v?(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)\s*$/m);
          const badge = raw.match(/badge\/version-(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)/i);
          const version = (meta.version || heading?.[1] || badge?.[1] || "").replace(/^v/i, "");
          if (!semver.test(version)) {
            throw new Error(`${releaseFile} needs a valid semver version, for example: version: 0.1.1 or ### v0.1.1`);
          }

          const tag = `v${version}`;
          const title = meta.title || `JellyGlance ${tag}`;
          const releaseNotes = notes || `Release ${tag}`;

          fs.writeFileSync("RELEASE_NOTES.md", `${releaseNotes}\n`);

          const output = fs.createWriteStream(process.env.GITHUB_OUTPUT, { flags: "a" });
          output.write(`version=${version}\n`);
          output.write(`tag=${tag}\n`);
          output.write(`title=${title}\n`);
          output.write(`is_beta=${isBeta ? "true" : "false"}\n`);
          output.write("notes_file=RELEASE_NOTES.md\n");
          NODE

      - name: Resolve git tag
        id: tag
        run: |
          git fetch --tags --force
          TAG="${{ steps.release.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; reusing it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist yet."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply release version to package files
        run: npm version "${{ steps.release.outputs.version }}" --workspaces --include-workspace-root --no-git-tag-version --allow-same-version

      - name: Verify package versions
        run: |
          node <<'NODE'
          const fs = require("fs");

          const expected = "${{ steps.release.outputs.version }}";
          const packageFiles = [
            "package.json",
            "apps/api/package.json",
            "apps/web/package.json",
          ];

          for (const file of packageFiles) {
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            if (pkg.version !== expected) {
              throw new Error(`${file} is ${pkg.version}, expected ${expected}`);
            }
          }

          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const lockPackages = {
            "package-lock root": lock,
            "package-lock packages root": lock.packages?.[""],
            "package-lock apps/api": lock.packages?.["apps/api"],
            "package-lock apps/web": lock.packages?.["apps/web"],
          };

          for (const [name, pkg] of Object.entries(lockPackages)) {
            if (!pkg) {
              throw new Error(`${name} is missing`);
            }
            if (pkg.version !== expected) {
              throw new Error(`${name} is ${pkg.version}, expected ${expected}`);
            }
          }

          console.log(`All package versions match ${expected}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint web app
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Report build-local package version changes
        run: |
          git add package.json package-lock.json apps/*/package.json
          if git diff --cached --quiet; then
            echo "Package files already match ${{ steps.release.outputs.version }}"
          else
            echo "::notice::Package files were updated locally for this release build only. Protected branches are not modified by the release workflow."
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Repo-scoped App tokens often cannot write user GHCR packages even with
          # Packages: write. GITHUB_TOKEN works because this package already grants
          # Actions access to Nerdy-Technician/JellyGlance. Git push/tag still use the Release Bot.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/nerdy-technician/jellyglance
          tags: |
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.is_beta != 'true' }}
            type=raw,value=main,enable=${{ steps.release.outputs.is_beta != 'true' }}
            type=raw,value=beta,enable=${{ steps.release.outputs.is_beta == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure git identity for release tag
        if: steps.tag.outputs.exists != 'true'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Create and push git tag
        if: steps.tag.outputs.exists != 'true'
        run: |
          git tag -a "${{ steps.release.outputs.tag }}" -m "${{ steps.release.outputs.title }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        id: github_release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; leaving it in place."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          prerelease_flag=""
          if [ "${{ steps.release.outputs.is_beta }}" = "true" ]; then
            prerelease_flag="--prerelease"
          fi

          gh release create "$TAG" \
            --title "${{ steps.release.outputs.title }}" \
            --notes-file "${{ steps.release.outputs.notes_file }}" \
            ${prerelease_flag}
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Post Discord release update
        if: steps.github_release.outputs.created == 'true'
        env:
          DISCORD_EVENT_TYPE: release
          DISCORD_BETA_WEBHOOK_URL: ${{ secrets.DISCORD_BETA_RELEASES_WEBHOOK }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          IS_BETA_RELEASE: ${{ steps.release.outputs.is_beta }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          NOTES_FILE: ${{ steps.release.outputs.notes_file }}
        run: |
          if [ "${IS_BETA_RELEASE}" = "true" ] && [ -n "${DISCORD_BETA_WEBHOOK_URL}" ]; then
            DISCORD_CHANNEL="beta" DISCORD_WEBHOOK_URL="${DISCORD_BETA_WEBHOOK_URL}" \
              RELEASE_NOTES="$(cat "${NOTES_FILE}")" node .github/scripts/discord-notify.mjs
            exit 0
          fi

          if [ "${IS_BETA_RELEASE}" != "true" ] && [ -n "${DISCORD_WEBHOOK_URL}" ]; then
            DISCORD_CHANNEL="stable" \
              RELEASE_NOTES="$(cat "${NOTES_FILE}")" node .github/scripts/discord-notify.mjs
          elif [ "${IS_BETA_RELEASE}" = "true" ] || [ -z "${DISCORD_WEBHOOK_URL}" ] && [ -z "${DISCORD_BETA_WEBHOOK_URL}" ]; then
            echo "No Discord release webhook configured for ${IS_BETA_RELEASE} release.";
          fi
