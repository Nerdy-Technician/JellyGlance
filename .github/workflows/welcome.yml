name: Welcome

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for opening an issue on **JellyGlance** 🪼

            A maintainer has been assigned automatically. Please fill the template as fully as you can (version, area, repro steps) — it speeds things up a lot.
          pr_message: |
            Thanks for the PR to **JellyGlance** 🪼

            Checks will run automatically and post a summary on each push. Please keep commits focused and update the PR description if the scope changes.
