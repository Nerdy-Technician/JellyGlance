name: "JellyGlance CodeQL"
queries:
  - uses: security-extended
query-filters:
  # Sanitizer helpers and call sites that only talk to admin-configured service URLs
  # after joinSafeHttpUrl / safeHttpGet/Post rebuild (blocklist + http(s) only).
  - exclude:
      id: js/remote-property-injection
      paths:
        - apps/api/utils/security.js
  - exclude:
      id: js/request-forgery
      paths:
        - apps/api/utils/security.js
        - apps/api/classes/command-center.js
        - apps/api/classes/download-client.js
        - apps/api/routes/api.js
        - apps/api/routes/auth.js
        - apps/api/routes/proxy.js
        - apps/api/routes/utils.js
