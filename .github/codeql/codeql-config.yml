name: "JellyGlance CodeQL"
queries:
  - uses: security-extended
query-filters:
  # Sanitizer helpers live here; sinks are intentional and gated by Map / URL rebuild.
  - exclude:
      id: js/remote-property-injection
      paths:
        - apps/api/utils/security.js
  - exclude:
      id: js/request-forgery
      paths:
        - apps/api/utils/security.js
