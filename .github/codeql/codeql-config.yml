name: "JellyGlance CodeQL"
queries:
  - uses: security-extended
query-filters:
  # Sanitizer / safe HTTP helpers — sinks are gated by URL rebuild + Map-only writes.
  - exclude:
      id: js/remote-property-injection
      paths:
        - apps/api/utils/security.js
  - exclude:
      id: js/request-forgery
      paths:
        - apps/api/utils/security.js
