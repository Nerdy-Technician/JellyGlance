name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - enhancement
      - feature
  - title: '🐛 Fixes'
    labels:
      - bug
      - fix
  - title: '📚 Docs'
    labels:
      - documentation
  - title: '🔌 Integrations'
    labels:
      - integration
  - title: '🔐 Security'
    labels:
      - security
  - title: '🐳 Docker / Deploy'
    labels:
      - docker
  - title: '🧰 Maintenance'
    labels:
      - dependencies
      - chore
      - ci
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
      - enhancement
      - feature
  patch:
    labels:
      - patch
      - bug
      - fix
      - documentation
      - dependencies
      - chore
  default: patch
template: |
  ## Changes

  $CHANGES
